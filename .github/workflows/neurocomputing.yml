name: Build Neurocomputing manuscript

on:
  push:
    paths:
      - 'neurocomputing_submission.tex'
      - 'references.bib'
      - 'Figures/**'
      - '.github/workflows/neurocomputing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4
      - name: Compile with pdfLaTeX, BibTeX and latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: neurocomputing_submission.tex
          texlive_version: 2026
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload manuscript PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neurocomputing-pdf-and-source
          path: |
            neurocomputing_submission.pdf
            neurocomputing_submission.tex
            references.bib
            Highlights.txt
            README_NEUROCOMPUTING_SUBMISSION.md
            Figures/
